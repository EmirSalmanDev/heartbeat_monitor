apiVersion: 1

# File provider — loads dashboard JSON from observability/grafana/dashboards,
# mounted read-only at /etc/grafana/dashboards in docker-compose.yml. Kept
# separate from the datasources provider file so each config concern lives in
# its own file, same pattern as datasources.yml.
providers:
  - name: Sentinel
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    # allowUiUpdates: false — dashboards are provisioned from this read-only
    # mount; an in-UI edit would be lost on the next Grafana restart, so the UI
    # should not offer to save over them.
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
