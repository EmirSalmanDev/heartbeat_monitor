events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Rate limiting zone — keyed by client IP
  limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
  # nginx's default for a throttled request is 503 (Service Unavailable), which
  # reads as a server fault. 429 (Too Many Requests) is the correct client-facing
  # semantic for rate limiting.
  limit_req_status 429;

  server {
    listen 80;

    # Serve React SPA static files
    location / {
      root  /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;   # SPA client-side routing fallback
    }

    # The /api/ proxy below strips the prefix, so /api/metrics would otherwise
    # reach the API's Prometheus endpoint from the public internet. Alloy scrapes
    # api:3001/metrics directly over sentinel_net and never goes through nginx,
    # so nothing legitimate needs this path.
    #
    # Regex rather than `location = /api/metrics`: an exact-match block misses
    # the trailing-slash form, and Express routing is non-strict by default, so
    # /api/metrics/ would still reach the endpoint. A matching regex location
    # takes precedence over the /api/ prefix location below.
    location ~ ^/api/metrics/*$ {
      deny all;
    }

    # Proxy API requests to Express
    location /api/ {
      limit_req zone=api burst=20 nodelay;

      proxy_pass         http://api:3001/;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;

      # CORS — not needed: React and API share same origin via Nginx
    }
  }
}
